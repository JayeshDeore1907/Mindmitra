<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMitra - Your AI Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">🧠</div>
                <div>
                    <h1>MindMitra</h1>
                    <p class="status"><span class="dot"></span> Always here for you</p>
                </div>
            </div>
            <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">
                <svg class="sun" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="10" cy="10" r="4"/><path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.9 3.9l1.4 1.4M14.7 14.7l1.4 1.4M3.9 16.1l1.4-1.4M14.7 5.3l1.4-1.4"/>
                </svg>
                <svg class="moon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </header>

        <!-- Welcome -->
        <div class="welcome" id="welcome">
            <div class="welcome-icon">✨</div>
            <h2>Hey! I'm MindMitra 🧠</h2>
            <p>Your AI buddy for college life, stress, or just a chat!</p>
            <div class="quick-btns">
                <button onclick="sendQuick('I need help with exam stress')">📚 Exam stress</button>
                <button onclick="sendQuick('Feeling overwhelmed')">😰 Overwhelmed</button>
                <button onclick="sendQuick('Need study tips')">📝 Study help</button>
                <button onclick="sendQuick('Just want to chat')">💬 Casual chat</button>
            </div>
        </div>

        <!-- Chat -->
        <div class="chat" id="chat"></div>

        <!-- Typing -->
        <div class="typing" id="typing">
            <div class="typing-avatar">🧠</div>
            <div class="typing-bubble">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <textarea 
                id="input" 
                placeholder="Type your message..."
                rows="1"
                maxlength="500"
            ></textarea>
            <button id="send" onclick="send()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Emergency Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>🆘 Need Immediate Help?</h3>
            <p>Please reach out to professionals:</p>
            <div class="helpline">
                <strong>KIRAN</strong>
                <a href="tel:18005990019">1800-599-0019</a>
                <span>24/7</span>
            </div>
            <div class="helpline">
                <strong>Vandrevala</strong>
                <a href="tel:18602662345">1860-266-2345</a>
                <span>24/7</span>
            </div>
            <div class="helpline">
                <strong>iCall (TISS)</strong>
                <a href="tel:9152987821">9152987821</a>
                <span>Mon-Sat 8AM-10PM</span>
            </div>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
